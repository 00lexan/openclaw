services:
  - type: web
    name: 
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: _STATE_DIR
        value: /data/.
      - key: _WORKSPACE_DIR
        value: /data/workspace
      - key: _GATEWAY_TOKEN
        generateValue: true
    disk:
      name: -data
      mountPath: /data
      sizeGB: 1

